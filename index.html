<!DOCTYPE html>
<header lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Movie Box - أفلام ومسلسلات</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الهيدر العلوي -->
    <header>
        <div class="header-container">
            <div class="logo">TheMovie<span>Box</span></div>
            <div class="search-icon" onclick="alert('خاصية البحث')">🔍</div>
        </div>
        <div class="categories-bar">
            <div class="cat-chip active" onclick="filterCategory('all', this)">الكل</div>
            <div class="cat-chip" onclick="filterCategory('movies', this)">أفلام</div>
            <div class="cat-chip" onclick="filterCategory('series', this)">مسلسلات</div>
            <div class="cat-chip" onclick="filterCategory('animation', this)">انميشن</div>
        </div>
    </header>

    <!-- الواجهة الرئيسية / البانر المتحرك -->
    <section class="hero-section" id="hero-banner">
        <div class="hero-overlay">
            <div class="hero-info">
                <span class="hero-badge">حصري</span>
                <h1 class="hero-title" id="hero-title">أحدث الأفلام العالمية</h1>
                <p class="hero-desc" id="hero-desc">استمتع بمشاهدة أحدث الإصدارات السينمائية بجودة عالية وبدون تقطيع.</p>
                <button class="watch-now-btn" onclick="openPlayer('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4')">▶ مشاهدة الآن</button>
            </div>
        </div>
    </section>

    <!-- أقسام الأفلام -->
    <main class="content-container">
        <section class="movie-section">
            <h2 class="section-title">🔥 الأفلام الرائجة</h2>
            <div class="movies-grid" id="grid-trending"></div>
        </section>

        <section class="movie-section">
            <h2 class="section-title">🎬 أحدث الأفلام المضافة</h2>
            <div class="movies-grid" id="grid-latest"></div>
        </section>
    </main>

    <!-- مشغل الفيديو -->
    <div id="video-modal" class="modal-player">
        <button class="close-player" onclick="closePlayer()">✕ إغلاق</button>
        <video id="main-video-player" controls playsinline>
            <source src="" type="video/mp4">
        </video>
    </div>

    <!-- الشريط السفلي للجوال -->
    <nav class="bottom-nav">
        <div class="nav-btn active">🏠 <span>الرئيسية</span></div>
        <div class="nav-btn" onclick="alert('قريباً')">🔥 <span>الرائجة</span></div>
        <div class="nav-btn" onclick="alert('قريباً')">⭐ <span>المفضلة</span></div>
    </nav>

    <script src="script.js"></script>
</body>
</html>

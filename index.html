<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QFLIX</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #141414; color: #fff; min-height: 100vh; padding-bottom: 70px; }

        header { background: rgba(0,0,0,0.85); position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header-top { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; }
        .netflix-logo-text { color: #E50914; font-size: 24px; font-weight: 900; letter-spacing: 1px; }

        .header-nav-tabs { display: flex; gap: 12px; overflow-x: auto; padding: 0 15px 12px; scrollbar-width: none; }
        .header-nav-tabs::-webkit-scrollbar { display: none; }
        .nav-tab { background: rgba(255,255,255,0.1); color: #ddd; padding: 6px 14px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; border: 1px solid rgba(255,255,255,0.15); }
        .nav-tab.active { background: #fff; color: #000; font-weight: bold; }

        .hero-banner { position: relative; width: 100%; height: 400px; background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; text-align: center; }
        .hero-banner::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 120px; background: linear-gradient(to top, #141414, transparent); }
        .hero-title-img { font-size: 28px; font-weight: 900; margin-bottom: 8px; position: relative; z-index: 2; }
        .hero-tags { font-size: 13px; color: #ccc; margin-bottom: 15px; position: relative; z-index: 2; }
        .hero-buttons { display: flex; gap: 10px; position: relative; z-index: 2; justify-content: center; }
        .hero-btn { flex: 1; max-width: 130px; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; border: none; }
        .btn-play { background: #fff; color: #000; }
        .btn-mylist { background: rgba(109, 109, 110, 0.7); color: #fff; }

        .section-title { font-size: 18px; margin: 25px 15px 12px; font-weight: bold; color: #fff; }
        .movies-row { display: flex; gap: 10px; overflow-x: auto; padding: 0 15px; scrollbar-width: none; }
        .movies-row::-webkit-scrollbar { display: none; }
        .movie-card-row { flex: 0 0 115px; background: #1f1f1f; border-radius: 6px; overflow: hidden; cursor: pointer; }
        .movie-poster-row { width: 100%; height: 165px; object-fit: cover; background: #222; }
        .movie-title-row { font-size: 11px; padding: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; color: #ccc; }

        /* مشغل الفيديو المباشر */
        #video-player-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 12000; flex-direction: column; justify-content: center; align-items: center; }
        #actual-video-player { width: 100%; height: 100%; object-fit: contain; }
        .video-back-btn { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); color: #fff; border: 1px solid #555; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; z-index: 13000; font-size: 16px; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(20,20,20,0.95); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #282828; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #8c8c8c; cursor: pointer; font-size: 11px; gap: 4px; }
        .nav-item.active { color: #fff; }
        .nav-icon { font-size: 20px; }
    </style>
</head>
<body>

    <!-- الواجهة الرئيسية المباشرة بدون أي تسجيل دخول -->
    <div id="main-content">
        <header>
            <div class="header-top">
                <div class="netflix-logo-text">QFLIX</div>
                <div style="font-size: 18px; cursor: pointer;" onclick="alert('خاصية البحث مفعلة')">🔍</div>
            </div>
            <div class="header-nav-tabs">
                <div class="nav-tab active">الرئيسية</div>
                <div class="nav-tab">أطفال والرسوم المتحركة</div>
                <div class="nav-tab">مصري وعربي</div>
                <div class="nav-tab">أكشن ومغامرة</div>
                <div class="nav-tab">كوميدي</div>
            </div>
        </header>

        <div class="hero-banner" style="background-image: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800');">
            <div class="hero-title-img">الوسيط الروحي</div>
            <div class="hero-tags">أحدث الإصدارات • غموض • حلقات كاملة</div>
            <div class="hero-buttons">
                <button class="hero-btn btn-play" onclick="playMovieDirectly()">▶ عرض</button>
                <button class="hero-btn btn-mylist" onclick="alert('تمت الإضافة لقائمتك')">＋ قائمتي</button>
            </div>
        </div>

        <div class="section-title">أفلام الأطفال والرسوم المتحركة</div>
        <div class="movies-row" id="row-kids"></div>

        <div class="section-title">أفلام ومسلسلات مصرية وعربية</div>
        <div class="movies-row" id="row-arabic"></div>

        <div class="section-title">أفلام الأكشن والحماس</div>
        <div class="movies-row" id="row-action"></div>

        <div class="section-title">أفلام الكوميديا والترفيه</div>
        <div class="movies-row" id="row-comedy"></div>
    </div>

    <!-- مشغل الفيديو المباشر والسريع -->
    <div id="video-player-screen">
        <button class="video-back-btn" onclick="closeVideoPlayer()">✕ إغلاق الفيديو</button>
        <video id="actual-video-player" controls autoplay playsinline>
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
        </video>
    </div>

    <!-- الشريط السفلي -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="window.scrollTo({top: 0, behavior: 'smooth'})"><span class="nav-icon">🏠</span><span>الرئيسية</span></div>
        <div class="nav-item" onclick="alert('خاصية البحث')"><span class="nav-icon">🔍</span><span>بحث</span></div>
        <div class="nav-item" onclick="playMovieDirectly()"><span class="nav-icon">▶️</span><span>العرض السريع</span></div>
    </div>

    <script>
        const validPosters = [
            "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500",
            "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500",
            "https://images.unsplash.com/photo-1485846234645-a62644f84728?w=500",
            "https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=500",
            "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500"
        ];

        window.addEventListener('DOMContentLoaded', () => {
            let kids = [], arabic = [], action = [], comedy = [];
            for(let i=1; i<=15; i++) {
                kids.push({title: `مغامرات أطفال ${i}`, img: validPosters[i % validPosters.length]});
                arabic.push({title: `دراما عربية ${i}`, img: validPosters[(i+1) % validPosters.length]});
                action.push({title: `أكشن ومغامرة ${i}`, img: validPosters[(i+2) % validPosters.length]});
                comedy.push({title: `كوميديا ${i}`, img: validPosters[(i+3) % validPosters.length]});
            }

            renderRow('row-kids', kids);
            renderRow('row-arabic', arabic);
            renderRow('row-action', action);
            renderRow('row-comedy', comedy);
        });

        function renderRow(elemId, data) {
            const container = document.getElementById(elemId);
            if(!container) return;
            container.innerHTML = data.map(m => `
                <div class="movie-card-row" onclick="playMovieDirectly()">
                    <img src="${m.img}" class="movie-poster-row" loading="lazy">
                    <div class="movie-title-row">${m.title}</div>
                </div>
            `).join('');
        }

        function playMovieDirectly() {
            const screen = document.getElementById('video-player-screen');
            const player = document.getElementById('actual-video-player');
            screen.style.display = 'flex';
            player.currentTime = 0;
            player.play().catch(e => console.log(e));
        }

        function closeVideoPlayer() {
            const screen = document.getElementById('video-player-screen');
            const player = document.getElementById('actual-video-player');
            player.pause();
            screen.style.display = 'none';
        }
    </script>
</body>
</html>
